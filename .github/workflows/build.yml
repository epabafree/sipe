name: Build deck
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install genanki
      - run: python build.py
        working-directory: source
      - name: Bundle CSVs and media
        run: cd source/out && zip -r ../../sipe_csv_and_media.zip csv media
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/out/*.apkg
            sipe_csv_and_media.zip
          body_path: CHANGELOG.md
