name: Build and release

# Every push to main builds the deck and publishes it as the release for the
# newest version in CHANGELOG.md. If that release already exists, its notes
# and files are replaced with the current build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install genanki

      - name: Build
        working-directory: source
        run: python -W ignore build.py

      - name: Bundle CSVs and media
        run: cd source/out && zip -qr ../../sipe_csv_and_media.zip csv media

      - uses: actions/upload-artifact@v4
        with:
          name: sipe-deck
          path: |
            source/out/sipe.apkg
            sipe_csv_and_media.zip

      - name: Read version from changelog
        id: version
        run: |
          version=$(grep -m1 -oP '^## \Kv[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          # release notes: the section under that heading, up to the next "## "
          awk -v v="$version" '
            $0 ~ "^## "v { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            source/out/sipe.apkg
            sipe_csv_and_media.zip

      - name: Update existing release
        if: steps.version.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.version.outputs.tag }}" --notes-file notes.md
          gh release upload "${{ steps.version.outputs.tag }}" source/out/sipe.apkg sipe_csv_and_media.zip --clobber

      - name: Sync notes of older releases with the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(grep -oP '^## \Kv[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md); do
            gh release view "$tag" >/dev/null 2>&1 || continue
            awk -v v="$tag" '
              $0 ~ "^## "v { on=1; next }
              on && /^## v0\.1\.0/ && v == "v0.2.0" { print ""; print; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md | sed 's#](docs/#](https://github.com/${{ github.repository }}/blob/main/docs/#g' > "notes_$tag.md"
            gh release edit "$tag" --notes-file "notes_$tag.md"
          done
