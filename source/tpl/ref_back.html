{{FrontSide}}
<div id="ans" class="sipe ans">
  <div class="read">
    <div class="block formula-block"><h4>{{Kind}}</h4><div class="formula">{{Formula}}</div></div>
    {{#Symbols}}<div class="block"><h4>What the symbols mean</h4>{{Symbols}}</div>{{/Symbols}}
    {{#When}}<div class="block tip"><h4>When to use it</h4>{{When}}</div>{{/When}}
    {{#Trap}}<div class="trap"><b>Watch out:</b> {{Trap}}</div>{{/Trap}}
    {{#Example}}<div class="block concept"><h4>Quick example</h4>{{Example}}</div>{{/Example}}
    {{#SeenIn}}<div class="tagline">Seen in: {{SeenIn}}</div>{{/SeenIn}}
  </div>
</div>
