<div class="tb">
  <button type="button" data-act="timer" title="Timer: tap to show or hide"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span class="tval">0:00</span></button>
  <button type="button" data-act="calc" title="Calculator"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg></button>
  <button type="button" data-act="text" title="Text size, font, timer and solution settings"><svg viewBox="0 0 24 24"><path d="M3 19 8.5 5h1L15 19M5 14h8M16.5 19l3-7.5h.5l3 7.5M17.5 16.5h4"/></svg></button>
  <button type="button" data-act="theme" title="Light / dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg><span class="lbl">Auto</span></button>
  <div class="tb-pop">
    <div class="row"><div class="rl">Text size</div><div class="seg"><button data-set="size=1">A−</button><button data-set="size=2">A</button><button data-set="size=3">A+</button></div></div>
    <div class="row"><div class="rl">Passage font</div><div class="seg"><button data-set="font=serif">Serif</button><button data-set="font=sans">Sans</button></div></div>
    <div class="row"><div class="rl">Timer</div><div class="seg"><button data-set="timer=show">Show</button><button data-set="timer=hide">Hide</button><button data-set="timer=off">Off</button></div></div>
    <div class="row"><div class="rl">Solution</div><div class="seg"><button data-set="steps=all">All at once</button><button data-set="steps=one">Step by step</button></div></div>
    <div class="row"><div class="rl">Theme</div><div class="seg"><button data-set="theme=auto">Auto</button><button data-set="theme=light">Light</button><button data-set="theme=dark">Dark</button></div></div>
  </div>
</div>
