{{FrontSide}}

<div id="ans" class="sipe ans">
  <div class="read">
    <div class="result neutral">Answers</div>
    {{Answers}}
    {{#SetSolution}}<div class="block"><details class="setsol" open><summary>Solve the whole set</summary>{{SetSolution}}</details></div>{{/SetSolution}}
    <div class="flagline"><span>Flag it if useful:</span>
      <span class="f" style="--c:#d14b43">Concept gap</span>
      <span class="f" style="--c:#e58a2e">Silly mistake</span>
      <span class="f" style="--c:#3d7fd9">Too slow</span>
      <span class="f" style="--c:#3fa560">New trick</span>
      <span class="kb">Ctrl/⌘ + 1 · 2 · 4 · 3, or the flag button on mobile</span>
    </div>
    <div class="tagline">{{Topic}} · {{SetID}}</div>
  </div>
</div>
