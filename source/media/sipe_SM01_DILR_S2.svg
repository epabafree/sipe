<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica,Arial,sans-serif"><rect width="600" height="400" fill="#fff"/><line x1="82.0" y1="190.4" x2="265.2" y2="110.2" stroke="#111827" stroke-width="2.5"/><polygon points="276.2,105.4 267.6,115.7 262.8,104.7" fill="#111827"/><line x1="322.0" y1="104.6" x2="505.2" y2="184.8" stroke="#111827" stroke-width="2.5"/><polygon points="516.2,189.6 502.8,190.3 507.6,179.3" fill="#111827"/><line x1="82.0" y1="209.6" x2="265.2" y2="289.8" stroke="#111827" stroke-width="2.5"/><polygon points="276.2,294.6 262.8,295.3 267.6,284.3" fill="#111827"/><line x1="322.0" y1="295.4" x2="505.2" y2="215.2" stroke="#111827" stroke-width="2.5"/><polygon points="516.2,210.4 507.6,220.7 502.8,209.7" fill="#111827"/><line x1="300.0" y1="281.0" x2="300.0" y2="133.0" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="300.0,121.0 306.0,133.0 294.0,133.0" fill="#2563eb"/><circle cx="60" cy="200" r="22" fill="#fff" stroke="#111827" stroke-width="2"/><text x="60" y="206" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">A</text><circle cx="300" cy="95" r="22" fill="#fff" stroke="#111827" stroke-width="2"/><text x="300" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">C1</text><circle cx="300" cy="305" r="22" fill="#fff" stroke="#111827" stroke-width="2"/><text x="300" y="311" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">C2</text><circle cx="540" cy="200" r="22" fill="#fff" stroke="#111827" stroke-width="2"/><text x="540" y="206" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">B</text><text x="150" y="40" text-anchor="middle" font-size="14" fill="#111827"><tspan x="150" dy="0" font-weight="bold">Pipeline 1: A → C1</tspan><tspan x="150" dy="17" fill="#6b7280">10 h, +30 min per extra unit</tspan></text><text x="450" y="40" text-anchor="middle" font-size="14" fill="#111827"><tspan x="450" dy="0" font-weight="bold">Pipeline 1: C1 → B</tspan><tspan x="450" dy="17" fill="#6b7280">3 h, +1 h 30 min per extra unit</tspan></text><text x="150" y="350" text-anchor="middle" font-size="14" fill="#111827"><tspan x="150" dy="0" font-weight="bold">Pipeline 2: A → C2</tspan><tspan x="150" dy="17" fill="#6b7280">3 h, +1 h 30 min per extra unit</tspan></text><text x="450" y="350" text-anchor="middle" font-size="14" fill="#111827"><tspan x="450" dy="0" font-weight="bold">Pipeline 2: C2 → B</tspan><tspan x="450" dy="17" fill="#6b7280">10 h, +25 min per extra unit</tspan></text><text x="314" y="180" text-anchor="start" font-size="14" fill="#2563eb"><tspan x="314" dy="0" font-weight="bold">New: C2 → C1</tspan><tspan x="314" dy="17" fill="#2563eb">(Q8–10 only)</tspan><tspan x="314" dy="17" fill="#2563eb">3 h 30 min (Q10: 2 h 30 min),</tspan><tspan x="314" dy="17" fill="#2563eb">+30 min per extra unit</tspan></text><text x="300.0" y="396" text-anchor="middle" font-size="12" fill="#6b7280">1 unit = 10,000 gallons. Each time is for the first unit through that stretch.</text></svg>